<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="form-box">

        <h2 class="brand">🔵 Aura</h2>
        <h1>Create an account</h1>
        <p class="subtitle">Sign up now and unlock exclusive access!</p>

        <form id="signupForm">
            <label>Your Name</label>
            <input type="text" id="name" placeholder="First Last" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="you@email.com" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="enter your password" required>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <button class="btn-outline">Sign In</button>

        <small class="footer">Help • Aura.com</small>
    </div>

    <div class="image-box">
        <img src="girl.png" alt="Illustration">
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
